name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (requires running on a matching version tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Match tag to package version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_RELEASE" != "true" ]]; then
            echo "Manual validation run: package artifacts will be built but not published."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Publishing requires running on a version tag." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e --workers=1

  package:
    name: Package on ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build:web

      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -ne [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "Configure both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "gsft-windows-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GSFT_WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Check macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_BASE64: ${{ secrets.MAC_APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
        run: |
          certificate_configured=false
          notarization_configured=false
          app_password_configured=false
          api_key_configured=false
          if [[ -n "$CERTIFICATE_BASE64" || -n "$CERTIFICATE_PASSWORD" ]]; then
            if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
              echo "Configure both MAC_CERTIFICATE_BASE64 and MAC_CERTIFICATE_PASSWORD, or neither." >&2
              exit 1
            fi
            certificate_configured=true
          fi
          if [[ -n "$APPLE_ID" || -n "$APPLE_APP_SPECIFIC_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
              echo "Configure APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID together, or none." >&2
              exit 1
            fi
            app_password_configured=true
          fi
          if [[ -n "$API_KEY_BASE64" || -n "$API_KEY_ID" || -n "$API_ISSUER" ]]; then
            if [[ -z "$API_KEY_BASE64" || -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
              echo "Configure MAC_APPLE_API_KEY_BASE64, MAC_APPLE_API_KEY_ID, and MAC_APPLE_API_ISSUER together, or none." >&2
              exit 1
            fi
            api_key_configured=true
          fi
          if [[ "$app_password_configured" == true && "$api_key_configured" == true ]]; then
            echo "Configure either Apple ID credentials or an App Store Connect API key, not both." >&2
            exit 1
          fi
          if [[ "$app_password_configured" == true || "$api_key_configured" == true ]]; then
            notarization_configured=true
          fi
          if [[ "$notarization_configured" == true && "$certificate_configured" != true ]]; then
            echo "Apple notarization requires a configured MAC signing certificate." >&2
            exit 1
          fi
          if [[ "$certificate_configured" == true ]]; then
            certificate_path="$RUNNER_TEMP/gsft-macos-signing.p12"
            printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
            echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
            echo "GSFT_MAC_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          fi
          if [[ "$api_key_configured" == true ]]; then
            api_key_path="$RUNNER_TEMP/gsft-apple-api-key.p8"
            printf '%s' "$API_KEY_BASE64" | base64 -D > "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          fi
          if [[ "$notarization_configured" == true ]]; then
            echo "GSFT_MAC_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          corepack enable pnpm --install-directory node_modules/.bin
          pnpm exec electron-builder --win nsis

      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && env.GSFT_WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw "Signed Windows installer was not produced."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: |
          corepack enable pnpm --install-directory node_modules/.bin
          pnpm exec electron-builder --linux AppImage

      - name: Build macOS package
        if: runner.os == 'macOS'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
        run: |
          corepack enable pnpm --install-directory node_modules/.bin
          pnpm exec electron-builder --mac dmg

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.GSFT_MAC_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          app_path="$(find release -maxdepth 4 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Signed macOS application bundle was not produced." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [[ "${GSFT_MAC_NOTARIZATION_ENABLED:-}" == "true" ]]; then
            dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            if [[ -z "$dmg_path" ]]; then
              echo "Notarized macOS disk image was not produced." >&2
              exit 1
            fi
            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
          fi

      - name: Create checksums
        run: node scripts/release-assets.mjs create "${{ runner.os }}" release

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.dmg
            release/release-manifest-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset checksums
        run: node scripts/release-assets.mjs verify release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
